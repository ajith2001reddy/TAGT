name: TAGT CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    name: Backend Test (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./backend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Run Jest Tests
      run: npm run test
      env:
        NODE_ENV: test
        JWT_SECRET: super_secret_test_key_1234567890
        # MongoDB Memory Server will handle the URI automatically in standard Jest setups
        # Firebase mocks should be handled within your test setup files

  frontend-build:
    name: Frontend TypeCheck & Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./web/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Frontend Type Check
      run: npx tsc --noEmit

    - name: Test Production Build
      run: npm run build
      env:
        # Avoid Firebase Admin errors on build if not mocking them locally
        NEXT_PUBLIC_POSTHOG_KEY: phc_test_mock_key
        NEXT_PUBLIC_POSTHOG_HOST: https://app.posthog.com
