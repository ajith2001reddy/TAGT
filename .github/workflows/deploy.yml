name: Deploy Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Backend)
        run: cd backend && npm install

      - name: Install dependencies (Web)
        run: cd web && npm install

      - name: Run CI Validation
        run: |
          cd web && npm run build
          # Add any other validation required before Vercel/Render takes over

      # Deployment to Vercel/Render happens automatically via GitHub Integration,
      # so this workflow is primarily to ensure the main branch is completely build-safe
      # before the cloud providers pull the code.
