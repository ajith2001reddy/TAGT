name: Deploy Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Backend)
        run: cd backend && npm install

      - name: Install dependencies (Web)
        run: cd web && npm install

      - name: Run CI Validation
        run: |
          cd web && npm run build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: dummy
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          STRIPE_SECRET_KEY: dummy_secret
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy_api_key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy_auth_domain
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy_project_id
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy_storage_bucket
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: dummy_messaging_sender_id
          NEXT_PUBLIC_FIREBASE_APP_ID: dummy_app_id

          # Add any other validation required before Vercel/Render takes over

      # Deployment to Vercel/Render happens automatically via GitHub Integration,
      # so this workflow is primarily to ensure the main branch is completely build-safe
      # before the cloud providers pull the code.
