groups:
  - name: TAGT_API_Alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_request_duration_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API Error Rate detected"
          description: "More than 5% of API requests are failing with 5xx server errors."
      
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API Latency"
          description: "95th percentile latency across the TAGT API is above 2.0 seconds."
